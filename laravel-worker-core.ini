; ============================================================
; COLAS CORE — tracker, default, service, send
; ============================================================

[program:laravel-worker-tracker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/current/artisan queue:work redis --queue=tracker --sleep=1 --tries=3 --timeout=60 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=apache
numprocs=3
redirect_stderr=true
stdout_logfile=/var/www/html/current/storage/logs/worker-tracker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=70
startsecs=3

[program:laravel-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/current/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=apache
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/current/storage/logs/worker-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stopwaitsecs=100
startsecs=3

[program:laravel-worker-service]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/current/artisan queue:work redis --queue=service --sleep=5 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/current/storage/logs/worker-service.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stopwaitsecs=100
startsecs=3

[program:laravel-worker-send]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/current/artisan queue:work redis --queue=send --sleep=3 --tries=3 --timeout=90 --max-jobs=500 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/current/storage/logs/worker-send.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stopwaitsecs=100
startsecs=3

[group:laravel-core]
programs=laravel-worker-tracker,laravel-worker-default,laravel-worker-service,laravel-worker-send