; ============================================================
; COLAS WEB SERVICES — APIs externas (Sutran, Mininter, etc.)
; ============================================================

[program:laravel-ws-general]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/current/artisan queue:work redis --queue=web-services --sleep=5 --tries=3 --timeout=180 --max-jobs=300 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=apache
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/current/storage/logs/worker-ws-general.log
stdout_logfile_maxbytes=30MB
stdout_logfile_backups=5
stopwaitsecs=190
startsecs=3

