<svg xmlns="http://www.w3.org/2000/svg" width="360" height="196" viewBox="0 0 360 196" fill="none">
  <!-- Ayuda del campo ID de rastreador (UI v2): app móvil con el campo
       del ID resaltado en el inicio de sesión. El texto lo pone el tooltip. -->
  <g stroke="#94a3b8" stroke-opacity=".18" stroke-width="10">
    <circle cx="272" cy="98" r="58"/>
    <circle cx="272" cy="98" r="86"/>
    <circle cx="272" cy="98" r="114"/>
  </g>
  <!-- flecha -->
  <path d="M112 128c26 22 64 22 104-2" stroke="#2e8bc0" stroke-width="2" stroke-linecap="round"/>
  <path d="M207 117l10 4-5 10" stroke="#2e8bc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- teléfono -->
  <rect x="222" y="8" width="102" height="196" rx="16" fill="#1f2937"/>
  <rect x="229" y="18" width="88" height="180" rx="9" fill="#f1f5f9"/>
  <rect x="258" y="12" width="30" height="4" rx="2" fill="#374151"/>
  <!-- logo genérico (pin) -->
  <path d="M273 44c-8 0-14 6-14 13 0 10 14 22 14 22s14-12 14-22c0-7-6-13-14-13z" fill="#2e8bc0"/>
  <circle cx="273" cy="57" r="5" fill="#f1f5f9"/>
  <!-- campo ID -->
  <rect x="236" y="96" width="74" height="16" rx="2" fill="#fff" stroke="#cbd5e1"/>
  <text x="241" y="107" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="#64748b">ID de rastreador</text>
  <rect x="238" y="98" width="44" height="12" rx="1" stroke="#e11d48" stroke-width="1.6"/>
  <!-- botón -->
  <rect x="236" y="118" width="74" height="15" rx="2" fill="#2e8bc0"/>
  <text x="273" y="128.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#fff">Ingresar</text>
  <rect x="236" y="140" width="6" height="6" rx="1" stroke="#94a3b8"/>
  <rect x="246" y="142" width="34" height="2.5" rx="1" fill="#cbd5e1"/>
</svg>
